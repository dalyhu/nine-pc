<!doctype html>
<html lang="en">
  <title>x9</title>
  <style>
    html,
    body {
      background-color: black;
      padding: 0;
      margin: 0;
      height: 100%;
    }
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation-name: spin;
      animation-duration: 1s;
      animation-timing-function: linear;
      animation-delay: 0s;
      animation-iteration-count: infinite;
      animation-direction: normal;
    }
  </style>

  <div
    id="loading-wrap"
    style="position: fixed; top: 0; width: 100%; height: 100%; background-color: black"
  >
    <div class="spinner" style="margin: 49% auto 0 auto"></div>
  </div>
  <iframe
    id="x9-ifm"
    src="/"
    style="width: 100%; height: 100%; padding: 0; margin: 0; border: none"
  ></iframe>

  <script>
    document.querySelector('#x9-ifm').addEventListener('load', () => {
      document.querySelector('#loading-wrap').style.display = 'none'
    })
  </script>
</html>
